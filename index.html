<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jay Swaminarayan Follow Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- SheetJS library to parse Excel dynamically in the browser -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.mini.min.js"></script>
  </head>
  <body>
    <main class="phone-screen">
      <!-- Splash Screen Overlay -->
      <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
          <div class="splash-logo-wrapper">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
          <p style="color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 2px; margin-top: 0; margin-bottom: 28px;">Follow Up</p>
          <div class="splash-spinner"></div>
        </div>
      </div>

      <section class="login-screen" id="loginScreen">
        <div class="brand-block">
          <h1>JAY SWAMINARAYAN</h1>
          <p>Member follow up</p>
        </div>
        <form class="login-form" id="loginForm">
          <label>
            Passcode
            <input id="passwordInput" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="Enter 4-digit passcode" required autofocus>
          </label>
          <button type="submit">Login</button>
          <p class="login-error" id="loginError" role="alert"></p>
        </form>
      </section>

      <section class="app-screen hidden" id="appScreen">
        <div class="app-header">
          <div>
            <h1>JAY SWAMINARAYAN</h1>
            <p id="listMeta">Assigned members</p>
          </div>
          <button class="logout-button" id="logoutButton" type="button">Logout</button>
        </div>

        <label class="search-box" id="searchBox">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"></path>
          </svg>
          <input id="searchInput" type="search" placeholder="Search for members..." aria-label="Search for members">
        </label>

        <label class="admin-filter hidden" id="adminFilterWrap">
          View user wise
          <select id="adminFilter"></select>
        </label>

        <section aria-live="polite">
          <ul class="member-list" id="memberList"></ul>
          <p class="empty-state" id="emptyState">No members found.</p>
        </section>

        <button class="whatsapp-fab" id="whatsappFab" aria-label="Share on WhatsApp" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.031 21.054c-1.526 0-3.003-.393-4.32-1.139l-4.8.1.91-4.634a9.141 9.141 0 0 1-1.282-4.707 9.16 9.16 0 1 1 9.492 10.38zM12.031 3.9a7.994 7.994 0 0 0-7.986 7.986c0 1.583.41 3.123 1.189 4.484l-.536 2.73 2.82-.544a7.94 7.94 0 0 0 4.513 1.365h.004a7.99 7.99 0 1 0-.004-16.021zM16.5 14.316c-.244-.122-1.455-.718-1.68-.8-.225-.082-.39-.122-.555.122-.165.244-.636.8-.78.962-.144.162-.29.182-.534.06-1.62-.8-2.618-1.597-3.6-3.29-.144-.244-.015-.376.107-.498.11-.11.244-.286.366-.43.121-.143.162-.244.244-.407.082-.162.04-.306-.02-.428-.061-.122-.555-1.342-.76-1.84-.201-.484-.405-.418-.555-.426-.144-.008-.31-.01-.475-.01a.908.908 0 0 0-.66.306c-.226.244-.863.844-.863 2.057s.884 2.385 1.008 2.548c.124.162 1.737 2.651 4.208 3.717 1.838.793 2.35.65 2.784.6.434-.05 1.455-.595 1.66-1.17.204-.575.204-1.066.143-1.17-.06-.104-.225-.164-.47-.286z" fill="currentColor"></path>
          </svg>
        </button>
      </section>

      <!-- In-App Twilio Call Overlay -->
      <div id="callOverlay" class="call-overlay hidden" aria-modal="true" role="dialog">
        <div class="call-modal">
          <div class="call-avatar-wrapper">
            <div class="call-avatar-pulse"></div>
            <div class="call-avatar">
              <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
          </div>
          <h2 id="callTargetName" class="call-target-name">Member Name</h2>
          <p id="callTargetPhone" class="call-target-phone">+91 00000 00000</p>
          <div id="callStatusBadge" class="call-status-badge">Connecting...</div>
          <div id="callTimer" class="call-timer">00:00</div>

          <div class="call-controls">
            <button id="muteBtn" class="call-control-btn" type="button" aria-label="Mute microphone">
              <svg id="muteIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
              <span id="muteLabel">Mute</span>
            </button>

            <button id="hangupBtn" class="call-control-btn hangup-btn" type="button" aria-label="End call">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
              </svg>
              <span>End</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <template id="memberTemplate">
      <li class="member-item">
        <span class="member-details">
          <span class="member-name"></span>
          <span class="member-phone-row">
            <span class="member-phone"></span>
            <span class="member-status-indicator hidden"></span>
          </span>
          <span class="member-owner"></span>
        </span>
        <div class="member-actions">
          <div class="status-menu">
            <button class="menu-button" aria-label="Status menu" type="button">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/>
              </svg>
            </button>
            <div class="status-dropdown">
              <button class="status-option" data-status="going" type="button">Coming</button>
              <button class="status-option" data-status="not-going" type="button">Not Coming</button>
              <button class="status-option" data-status="maybe" type="button">Maybe</button>
              <button class="status-option" data-status="not-received" type="button">Call Not Received</button>
            </div>
          </div>
          <a class="call-button" aria-label="Call member">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.35 1.89.66 2.78a2 2 0 0 1-.45 2.11L8.05 9.88a16 16 0 0 0 6.07 6.07l1.27-1.27a2 2 0 0 1 2.11-.45c.89.31 1.82.53 2.78.66A2 2 0 0 1 22 16.92Z"></path>
            </svg>
          </a>
        </div>
      </li>
    </template>

    <script type="module" src="script.js"></script>
  </body>
</html>
